<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shadow Empire</title>
  <script>
  (function () {
    if (location.hostname !== 'game.rebbe47.info') return;
    if (new URLSearchParams(location.search).get('global') === '1') return;

    fetch('/cdn-cgi/trace', {cache: 'no-store'})
      .then(function (response) { return response.text(); })
      .then(function (trace) {
        if (!/(^|\n)loc=RU(\n|$)/.test(trace)) return;

        location.replace(
          'https://ru-game.rebbe47.info' +
          location.pathname +
          location.search +
          location.hash
        );
      })
      .catch(function () {});
  }());
  </script>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=20260918-1">
</head>
<body>
  <main id="app">
    <div id="ruMirrorNotice" style="margin:10px 0;padding:10px;border:1px solid #d4af37;border-radius:10px;background:#17140a;color:#f6e7a7;font-size:13px;line-height:1.35">
      <strong>Игра не загружается из России?</strong><br>
      Российские провайдеры ограничивают Cloudflare.
      Откройте прямое зеркало — комнаты и игровой сервер общие.

      <a id="ruMirrorLink" href="https://ru-game.rebbe47.info/" style="display:block;margin-top:8px;padding:10px;border-radius:8px;background:#d4af37;color:#111;text-decoration:none;font-weight:800">
        🇷🇺 Открыть версию для России
      </a>
    </div>

    <script>
    (function () {
      var notice = document.getElementById('ruMirrorNotice');
      var link = document.getElementById('ruMirrorLink');

      link.href =
        'https://ru-game.rebbe47.info' +
        location.pathname +
        location.search +
        location.hash;

      if (location.hostname === 'ru-game.rebbe47.info') {
        notice.style.display = 'none';
      }
    }());
    </script>

    <input id="nameInput" autocomplete="nickname">
  </main>
  <script src="/app.js?v=20260918-1"></script>
</body>
</html>
